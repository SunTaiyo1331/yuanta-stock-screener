<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧選股站</title>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#0a0c10',
                        'card-bg': 'rgba(23, 27, 36, 0.7)',
                        'card-border': 'rgba(255, 255, 255, 0.08)',
                        'accent-primary': '#3b82f6',
                        'success': '#10b981',
                        'danger': '#ef4444'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
                        'glow': '0 0 20px rgba(59, 130, 246, 0.4)',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="bg-brand-bg text-gray-200 min-h-screen antialiased overflow-x-hidden">
    <!-- 背景裝飾光暈 -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-accent-primary opacity-20 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-purple-600 opacity-20 blur-[100px] pointer-events-none z-0"></div>

    <!-- 頂部常駐 Header & Navigation Bar -->
    <header class="sticky top-0 z-50 bg-brand-bg/85 backdrop-blur-xl border-b border-card-border px-4 lg:px-8 py-3.5 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Logo 與 更新時間 -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent-primary to-purple-600 flex items-center justify-center font-black text-white text-xl shadow-glow">
                        📈
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                            智慧選股站
                        </h1>
                        <p id="last-updated" class="text-xs text-gray-400 font-mono">
                            最後更新時間：載入中...
                        </p>
                    </div>
                </div>
            </div>

            <!-- Tab 頁籤列 -->
            <nav class="flex items-center gap-2 overflow-x-auto max-w-full pb-1 md:pb-0 scrollbar-none w-full md:w-auto">
                <button onclick="switchTab('market')" id="tab-market" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap bg-accent-primary text-white shadow-glow">
                    🌐 大盤指數
                </button>
                <button onclick="switchTab('tea')" id="tab-tea" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all whitespace-nowrap">
                    🍵 茶葉智慧站
                </button>
                <button onclick="switchTab('moon')" id="tab-moon" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all whitespace-nowrap">
                    🌙 止月策略
                </button>
                
                <!-- 未解鎖時顯示的 驗證區 按鈕 -->
                <button onclick="unlockVerifyArea()" id="verify-lock-btn" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm text-amber-400 hover:text-amber-300 hover:bg-amber-500/10 transition-all whitespace-nowrap border border-amber-500/30 flex items-center gap-1.5 shadow-sm">
                    🔒 驗證區
                </button>

                <!-- 解鎖後向右展開的區塊 -->
                <div id="verify-expanded-tabs" class="hidden flex items-center gap-2 animate-fade-in">
                    <button onclick="switchTab('test')" id="tab-test" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all whitespace-nowrap">
                        🧪 測試策略
                    </button>
                    <button onclick="switchTab('etf')" id="tab-etf" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all whitespace-nowrap">
                        📊 ETF 區
                    </button>
                    <button onclick="switchTab('fifty')" id="tab-fifty" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all whitespace-nowrap">
                        🏆 50大
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- 主內容區域 -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- 載入中 -->
        <div id="loading" class="flex justify-center items-center py-20">
            <div class="loader"></div>
        </div>

        <!-- TAB 1: 大盤與指數視圖 (Market View) -->
        <div id="view-market" class="space-y-8 hidden animate-fade-in">
            <!-- 全球指數即時速覽列 -->
            <div id="indices-ticker" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                <!-- 指數卡片由 JS 動態生成 -->
            </div>

            <!-- 台股加權指數大圖卡 -->
            <div class="bg-gray-900/60 border border-gray-800 rounded-3xl p-6 backdrop-blur-md shadow-2xl relative w-full">
                <div class="flex flex-wrap items-center justify-between mb-4 gap-2">
                    <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                        <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">台股加權指數 <span class="text-xs sm:text-sm font-normal text-gray-400 ml-1">TAIEX</span></h2>
                        <div id="taiex-current-price" class="font-mono text-lg sm:text-xl font-bold text-white ml-2"></div>
                        <div id="taiex-change" class="font-mono text-xs sm:text-sm px-2 py-0.5 rounded ml-1"></div>
                    </div>
                </div>
                <div id="taiex-chart" class="w-full h-[360px] sm:h-[420px] rounded-xl bg-[#0e121a] border border-gray-800/80"></div>
            </div>

            <!-- 美股重要指數 K 線圖區域 -->
            <div>
                <h3 class="text-2xl font-extrabold text-white tracking-tight mb-6 flex items-center gap-2">
                    🇺🇸 美股重要指數 K 線圖
                </h3>
                <div id="us-indices-charts" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 美股指數圖表將由 JS 動態生成 -->
                </div>
            </div>
        </div>

        <!-- 選股 / ETF 區塊視圖 (Screener Views) -->
        <div id="view-screener" class="hidden space-y-6 animate-fade-in">
            <div class="flex justify-between items-center pb-4 border-b border-gray-800">
                <h2 id="screener-title" class="text-3xl font-extrabold text-white tracking-tight">
                    策略結果
                </h2>
                <div class="text-xs text-gray-500">
                    顯示符合條件之最新股票
                </div>
            </div>

            <!-- 股票列表 Grid -->
            <div id="stock-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- 卡片由 JS 動態生成 -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">🔍</div>
                <h2>今日無符合條件的標的</h2>
                <p>目前沒有股票同時滿足此策略的嚴苛條件，請明日再回來查看。</p>
            </div>

            <!-- Table Container (For ETFs) -->
            <div id="table-container" class="hidden mt-6">
                <!-- 長期 ETF 表格 -->
                <h3 id="long-etf-title" class="text-xl font-bold text-white mb-4 hidden">📈 長期 ETF</h3>
                <div id="long-etf-table-wrap" class="overflow-x-auto rounded-2xl border border-gray-800 bg-gray-900/60 backdrop-blur-md shadow-2xl mb-8 hidden">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead id="long-etf-table-head" class="bg-gray-800/80 border-b border-gray-700 text-gray-300"></thead>
                        <tbody id="long-etf-table-body" class="divide-y divide-gray-800/50"></tbody>
                    </table>
                </div>
                <!-- 高股息 ETF 表格 -->
                <h3 id="high-div-title" class="text-xl font-bold text-white mb-4 hidden">💸 高股息 ETF</h3>
                <div id="high-div-table-wrap" class="overflow-x-auto rounded-2xl border border-gray-800 bg-gray-900/60 backdrop-blur-md shadow-2xl hidden">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead id="high-div-table-head" class="bg-gray-800/80 border-b border-gray-700 text-gray-300"></thead>
                        <tbody id="high-div-table-body" class="divide-y divide-gray-800/50"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- 範本: 股票卡片 -->
    <template id="stock-card-template">
        <div class="stock-card group relative rounded-2xl bg-card-bg border border-card-border p-6 backdrop-blur-md overflow-hidden transition-all duration-300 hover:shadow-glow hover:-translate-y-1">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="text-2xl font-bold text-white stock-name tracking-wide"></h3>
                    <p class="text-gray-400 font-mono text-sm stock-symbol mt-1"></p>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-bold text-white stock-price font-mono"></div>
                    <div class="text-sm font-semibold stock-change flex items-center justify-end mt-1 font-mono">
                        <span class="change-icon mr-1"></span>
                        <span class="change-value"></span>
                        <span class="change-percent ml-1 text-xs px-2 py-0.5 rounded-full bg-opacity-20"></span>
                    </div>
                </div>
            </div>

            <div class="h-px w-full bg-gray-800 my-3"></div>

            <div class="flex justify-between items-center px-2">
                <div class="metric-item text-left">
                    <div class="text-[10px] text-gray-500 mb-0.5">成交量</div>
                    <div class="font-mono text-gray-300 text-sm"><span class="stock-volume font-bold text-white"></span> 張</div>
                </div>
                <div class="metric-item text-right">
                    <div class="text-[10px] text-accent-primary/80 mb-0.5">💡 建議購入價</div>
                    <div class="font-mono text-accent-primary font-bold text-sm"><span class="stock-suggest-price"></span></div>
                </div>
            </div>
            
            <!-- ECharts 專業圖表容器 -->
            <div class="chart-container mt-3 w-full h-[450px] rounded-lg bg-[#0e121a] border border-gray-800"></div>
        </div>
    </template>

    <script src="app.js?v=16"></script>
</body>
</html>
