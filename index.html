<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧選股站</title>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#ffffff',
                        'section-gray': '#f5f5f7',
                        'ink': '#1d1d1f',
                        'ink-soft': '#6e6e73',
                        'ink-faint': '#86868b',
                        'card-bg': '#ffffff',
                        'card-border': '#e8e8ed',
                        'hairline': '#d2d2d7',
                        'accent-primary': '#0071e3',
                        'accent-press': '#0077ed',
                        'success': '#34c759',
                        'danger': '#ff3b30'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', '"Noto Sans TC"', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 24px rgba(0, 0, 0, 0.06)',
                        'soft-lg': '0 12px 40px rgba(0, 0, 0, 0.10)',
                        'pill': '0 2px 12px rgba(0, 113, 227, 0.25)',
                    }
                }
            }
        }
    </script>
    <!-- 中文字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="bg-brand-bg text-ink min-h-screen antialiased overflow-x-hidden">

    <!-- Apple 式細窄半透明導覽列 -->
    <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-2xl border-b border-card-border/70">
        <div class="max-w-5xl mx-auto px-5 flex items-center justify-between h-12 gap-4">
            <!-- Logo -->
            <a href="#" class="shrink-0 text-[15px] font-semibold tracking-tight text-ink">
                智慧選股站
            </a>
            <!-- Tab 頁籤列 -->
            <nav class="flex items-center gap-1 overflow-x-auto scrollbar-none">
                <button onclick="switchTab('market')" id="tab-market" class="tab-btn-active text-[12px] font-medium text-white bg-ink rounded-full px-3.5 py-1.5 whitespace-nowrap transition-colors duration-200">
                    大盤指數
                </button>
                <button onclick="switchTab('tea')" id="tab-tea" class="tab-btn text-[12px] font-medium text-ink-soft hover:text-ink rounded-full px-3.5 py-1.5 whitespace-nowrap transition-colors duration-200">
                    茶葉智慧站
                </button>
                <button onclick="switchTab('moon')" id="tab-moon" class="tab-btn text-[12px] font-medium text-ink-soft hover:text-ink rounded-full px-3.5 py-1.5 whitespace-nowrap transition-colors duration-200">
                    止月策略
                </button>
                <!-- 未解鎖時顯示的 驗證區 按鈕 -->
                <button onclick="unlockVerifyArea()" id="verify-lock-btn" class="text-[12px] font-medium text-ink-soft hover:text-ink rounded-full px-3.5 py-1.5 whitespace-nowrap transition-colors duration-200">
                    驗證區
                </button>
                <!-- 解鎖後展開的區塊 -->
                <div id="verify-expanded-tabs" class="hidden flex items-center gap-1 animate-fade-in">
                    <button onclick="switchTab('etf')" id="tab-etf" class="tab-btn text-[12px] font-medium text-ink-soft hover:text-ink rounded-full px-3.5 py-1.5 whitespace-nowrap transition-colors duration-200">
                        ETF 區
                    </button>
                    <button onclick="switchTab('fifty')" id="tab-fifty" class="tab-btn text-[12px] font-medium text-ink-soft hover:text-ink rounded-full px-3.5 py-1.5 whitespace-nowrap transition-colors duration-200">
                        50大
                    </button>
                </div>
            </nav>
            <!-- 更新時間 -->
            <div id="last-updated" class="hidden lg:block shrink-0 text-[11px] text-ink-faint">
                最後更新：載入中
            </div>
        </div>
    </header>

    <!-- 主內容區域 -->
    <main class="max-w-5xl mx-auto px-5 pb-24">

        <!-- Hero 標語區 -->
        <section class="text-center pt-16 pb-10 px-4">
            <h1 class="text-4xl sm:text-5xl md:text-[56px] font-semibold tracking-tight text-ink leading-tight">
                智慧選股站
            </h1>
            <p class="mt-3 text-lg sm:text-xl text-ink-soft font-normal">
                每日自動篩選，把值得看的標的擺在你面前。
            </p>
            <p id="local-data-note" class="hidden mt-4 text-[13px] text-ink-faint">
                ⚠️ GitHub 資料來源連不上，目前顯示本地 data.json
            </p>
        </section>

        <!-- 載入中 -->
        <div id="loading" class="flex justify-center items-center py-24">
            <div class="loader"></div>
        </div>

        <!-- TAB 1: 大盤與指數視圖 (Market View) -->
        <div id="view-market" class="space-y-14 hidden animate-fade-in">
            <!-- 全球指數速覽 -->
            <div id="indices-ticker" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                <!-- 指數卡片由 JS 動態生成 -->
            </div>

            <!-- 台股加權指數大圖 -->
            <section>
                <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight text-ink mb-1">台股加權指數</h2>
                <div class="flex items-baseline gap-3 mb-5 flex-wrap">
                    <span id="taiex-current-price" class="text-3xl sm:text-4xl font-semibold tracking-tight text-ink"></span>
                    <span id="taiex-change" class="text-[15px] font-medium"></span>
                    <span class="text-[13px] text-ink-faint">TAIEX</span>
                </div>
                <div class="rounded-2xl bg-white border border-card-border shadow-soft p-2 sm:p-4">
                    <div id="taiex-chart" class="w-full h-[360px] sm:h-[420px]"></div>
                </div>
            </section>

            <!-- 美股重要指數 -->
            <section>
                <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight text-ink mb-5">美股重要指數</h2>
                <div id="us-indices-charts" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 美股指數圖表將由 JS 動態生成 -->
                </div>
            </section>
        </div>

        <!-- 選股 / ETF 區塊視圖 (Screener Views) -->
        <div id="view-screener" class="hidden space-y-8 animate-fade-in">
            <div>
                <h2 id="screener-title" class="text-3xl sm:text-4xl font-semibold tracking-tight text-ink">
                    策略結果
                </h2>
                <p class="mt-2 text-[15px] text-ink-soft">
                    顯示符合條件之最新股票
                </p>
            </div>

            <!-- 股票列表 Grid -->
            <div id="stock-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                <!-- 卡片由 JS 動態生成 -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state hidden text-center py-24">
                <p class="text-2xl font-semibold text-ink">今日無符合條件的標的</p>
                <p class="mt-2 text-[15px] text-ink-soft">目前沒有股票同時滿足此策略的嚴苛條件，請明日再回來查看。</p>
            </div>

            <!-- Table Container (For ETFs) -->
            <div id="table-container" class="hidden space-y-10">
                <!-- 長期 ETF 表格 -->
                <section>
                    <h3 id="long-etf-title" class="text-xl font-semibold tracking-tight text-ink mb-3 hidden">長期 ETF</h3>
                    <div id="long-etf-table-wrap" class="overflow-x-auto etf-table-wrap hidden">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead id="long-etf-table-head" class="text-[12px] uppercase tracking-wide text-ink-faint border-b border-hairline"></thead>
                            <tbody id="long-etf-table-body" class="divide-y divide-card-border"></tbody>
                        </table>
                    </div>
                </section>
                <!-- 高股息 ETF 表格 -->
                <section>
                    <h3 id="high-div-title" class="text-xl font-semibold tracking-tight text-ink mb-3 hidden">高股息 ETF</h3>
                    <div id="high-div-table-wrap" class="overflow-x-auto etf-table-wrap hidden">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead id="high-div-table-head" class="text-[12px] uppercase tracking-wide text-ink-faint border-b border-hairline"></thead>
                            <tbody id="high-div-table-body" class="divide-y divide-card-border"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>

        <!-- 頁尾 -->
        <footer class="border-t border-card-border pt-6 mt-8">
            <p class="text-[12px] text-ink-faint">
                資料來源：TWSE・TPEx・FinMind・Yahoo Finance　｜　本網頁僅供研究參考，不構成投資建議
            </p>
        </footer>
    </main>

    <!-- 範本: 股票卡片（Apple 式極簡卡） -->
    <template id="stock-card-template">
        <div class="stock-card relative rounded-2xl bg-white border border-card-border shadow-soft overflow-hidden transition-all duration-300 hover:shadow-soft-lg">
            <div class="px-6 pt-6 pb-5">
                <div class="flex justify-between items-start mb-5">
                    <div>
                        <h3 class="text-xl font-semibold tracking-tight text-ink stock-name"></h3>
                        <p class="text-[13px] text-ink-faint stock-symbol mt-0.5"></p>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-semibold tracking-tight text-ink stock-price"></div>
                        <div class="text-[13px] font-medium stock-change mt-1">
                            <span class="change-icon mr-0.5"></span><span class="change-value"></span>
                            <span class="change-percent ml-1"></span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center text-[13px]">
                    <div>
                        <span class="text-ink-faint">成交量</span>
                        <span class="ml-2 text-ink font-medium"><span class="stock-volume"></span> 張</span>
                    </div>
                    <div>
                        <span class="text-ink-faint">建議購入價</span>
                        <span class="ml-2 text-accent-primary font-semibold"><span class="stock-suggest-price"></span></span>
                    </div>
                </div>
            </div>

            <!-- ECharts 圖表容器 -->
            <div class="chart-container w-full h-[450px] border-t border-card-border"></div>
        </div>
    </template>

    <script src="app.js?v=17"></script>
</body>
</html>
